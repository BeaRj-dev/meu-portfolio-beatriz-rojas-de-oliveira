<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Financeiro | Mobile Ready</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <aside>
        <div class="mode-toggle" id="theme-toggle">MODO CLARO</div>
        
        <section class="form-container">
            <h1>Controle Financeiro</h1>
            
            <div class="input-group">
                <label>DESCRIÇÃO</label>
                <input type="text" id="desc-input" list="sugestoes" placeholder="Ex: Uber, Almoço...">
                <datalist id="sugestoes"></datalist>
            </div>

            <div class="input-group">
                <label>CATEGORIA</label>
                <select id="cat-input">
                    <option value="COMIDA">COMIDA</option>
                    <option value="TRANSPORTE" selected>TRANSPORTE</option>
                    <option value="SAUDE">SAÚDE</option>
                    <option value="BELEZA">BELEZA</option>
                    <option value="MENSALIDADES">RECORRENTES</option>
                    <option value="FATURA">FATURA</option>
                    <option value="OUTROS">OUTROS</option>
                </select>
            </div>

            <div class="input-group">
                <label>VALOR (R$)</label>
                <input type="number" id="val-input" placeholder="0.00" step="0.01">
            </div>

            <button id="btn-registrar">REGISTRAR</button>
            <button id="btn-limpar" class="btn-secondary">LIMPAR TUDO</button>
        </section>
    </aside>

    <main>
        <div class="dashboard">
            <div class="history-section">
                <h2 class="section-title">HISTÓRICO</h2>
                <div id="lista-historico"></div>
            </div>

            <div class="visual-section">
                <div class="chart-container-group">
                    <h2 class="section-title">DISTRIBUIÇÃO</h2>
                    <div id="pie-chart"></div>
                </div>
                
                <div class="summary-section">
                    <h2 class="section-title">RESUMO POR CATEGORIA</h2>
                    <div id="categoria-stats" class="stats-grid"></div>
                </div>
            </div>
        </div>

        <div class="info-footer-area">
            <div class="total-bar">
                TOTAL: R$ <span id="total-display">0.00</span>
            </div>
            
            <footer>
                <p>Controle Financeiro &copy; 2026 - Desenvolvido por Beatriz Rojas</p>
            </footer>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
